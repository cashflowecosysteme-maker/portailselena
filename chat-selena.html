<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/FavIcon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Séléna — NyXia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{--bg1:#0A1628;--p:#7B5CFF;--p2:#5A6CFF;--p3:#4FA3FF;--gold:#F4C842;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--t4:#4a5278;--green:#00E676;--red:#FF4B6E}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:var(--bg1);color:var(--t2);font-family:'Outfit',sans-serif;overflow:hidden}
    canvas#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 50% at 30% 8%,rgba(123,92,255,0.14) 0%,transparent 65%),radial-gradient(ellipse 50% 40% at 78% 92%,rgba(79,163,255,0.08) 0%,transparent 60%)}
    .shell{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;max-width:820px;margin:0 auto}
    .head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(123,92,255,0.12);flex-shrink:0}
    .head img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(123,92,255,0.5);box-shadow:0 0 20px rgba(123,92,255,0.35)}
    .head .name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;color:var(--t)}
    .head .sub{font-size:12px;color:var(--t3)}
    .msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin;scrollbar-color:rgba(123,92,255,0.35) transparent}
    .msgs::-webkit-scrollbar{width:6px}
    .msgs::-webkit-scrollbar-track{background:transparent}
    .msgs::-webkit-scrollbar-thumb{background:rgba(123,92,255,0.30);border-radius:50px}
    .msgs::-webkit-scrollbar-thumb:hover{background:rgba(123,92,255,0.5)}
    .msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
    .msg.user{flex-direction:row-reverse}
    .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;object-fit:cover;border:1px solid rgba(123,92,255,0.4)}
    .av.u{background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px}
    .bubble{background:rgba(123,92,255,0.08);border:1px solid rgba(123,92,255,0.14);border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.6;color:var(--t2);word-wrap:break-word}
    .msg.user .bubble{background:linear-gradient(135deg,rgba(123,92,255,0.25),rgba(90,108,255,0.18));color:#fff}
    .bubble a{color:var(--p3)} .bubble strong{color:var(--t)}
    .col{display:flex;flex-direction:column;gap:6px;max-width:80%}
    .msg.user .col{align-items:flex-end}
    .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
    .actions button{background:none;border:1px solid rgba(123,92,255,0.25);color:var(--t3);border-radius:50px;font-size:11px;padding:4px 11px;cursor:pointer;transition:.2s;font-family:'Outfit',sans-serif}
    .actions button:hover{color:var(--t);border-color:rgba(123,92,255,0.6)}
    .gen-img{max-width:300px;border-radius:14px;border:1px solid rgba(123,92,255,0.2);margin-top:6px;display:block}
    .parch{background:rgba(244,200,66,0.06);border:1px solid rgba(244,200,66,0.3);border-radius:14px;padding:14px 16px;margin-top:8px;white-space:pre-wrap;font-size:14px;line-height:1.6}
    .parch-copy{margin-top:10px;background:rgba(244,200,66,0.15);border:1px solid rgba(244,200,66,0.4);color:var(--gold);border-radius:50px;font-size:12px;font-weight:600;padding:6px 14px;cursor:pointer}
    video.welcome{width:100%;max-width:420px;border-radius:16px;border:1px solid rgba(123,92,255,0.25);box-shadow:0 0 40px rgba(123,92,255,0.2)}
    .nx-dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--p3);animation:blink 1.2s infinite}
    .nx-dots i:nth-child(2){animation-delay:.2s}.nx-dots i:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
    .composer{display:flex;gap:10px;align-items:flex-end;padding:14px 20px;border-top:1px solid rgba(123,92,255,0.12);flex-shrink:0}
    textarea{flex:1;background:rgba(10,22,40,0.7);border:1px solid rgba(123,92,255,0.25);border-radius:16px;color:var(--t);font-family:'Outfit',sans-serif;font-size:15px;padding:12px 14px;resize:none;outline:none;max-height:120px}
    textarea:focus{border-color:rgba(123,92,255,0.6)}
    .ico-btn{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.2s}
    .mic{background:rgba(123,92,255,0.12);border:1px solid rgba(123,92,255,0.3);color:var(--t2)}
    .mic.on{background:var(--red);color:#fff;animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,75,110,.5)}50%{box-shadow:0 0 0 8px rgba(255,75,110,0)}}
    .send{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 0 20px rgba(123,92,255,0.4)}
    .send:disabled{opacity:.5;cursor:not-allowed}
    .mic-hint{font-size:11px;color:var(--p3);text-align:center;padding:0 20px 8px;min-height:16px;flex-shrink:0}
      .fo-launch {
      width: 100%;
      border: 1px solid rgba(123,92,255,0.35);
      background: rgba(123,92,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--t);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: all .18s ease;
      box-shadow: 0 0 18px rgba(123,92,255,0.18), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .fo-launch:hover {
      border-color: rgba(123,92,255,0.6);
      background: rgba(123,92,255,0.2);
      box-shadow: 0 0 26px var(--glow), inset 0 1px 0 rgba(255,255,255,0.10);
      transform: translateY(-1px);
    }

  </style>
</head>
<body>
  <canvas id="starry-canvas"></canvas>
  <div class="shell">
    <div class="head">
      <img id="h-av" src="" alt="">
      <div><div class="name" id="h-name"></div><div class="sub">Ton formateur · disponible à toute heure</div></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div id="formation-launch-wrap" style="display:none;padding:8px 24px 0;flex-shrink:0">
      <button type="button" id="formation-launch" onclick="foLaunch()" class="fo-launch">
        ✨ Commencer ma formation
      </button>
    </div>

    <div class="mic-hint" id="mic-hint"></div>
    <div class="composer">
      <button class="ico-btn mic" id="mic" title="Parler">🎤</button>
      <textarea id="input" rows="1" placeholder="Écris ou parle à ton formateur..."></textarea>
      <button class="ico-btn send" id="send" title="Envoyer">➤</button>
    </div>
  </div>

  <script src="/starry-bg.js" defer></script>
  <script>
  /* ═══════════════ CONFIG DU PERSONNAGE — CHANGE ICI ═══════════════
     Pour créer un nouveau personnage : copie ce fichier et modifie
     seulement ce bloc. Le "code" DOIT correspondre au personnage du worker
     (minuscules, sans accent). Tout le reste fonctionne tout seul.
  ═══════════════════════════════════════════════════════════════════ */
  var AGENT = {
    code:    'selena',
    name:    'Séléna',
    avatar:  '/Selena.png',
    video:   'COLLE_ICI_URL_VIDEO_SELENA',
    greeting:"Bonjour, je suis Séléna. Je t'accompagne pas à pas, à ton rythme, une seule idée à la fois. Dis-moi par où tu veux commencer. ✦"
  };
  /* ═══════════════════════════════════════════════════════════════════ */

  var token = sessionStorage.getItem('nyxia_token');
  var userName = localStorage.getItem('nyxia_username') || 'toi';
  var history = [];
  var lastUserMessage = null;
  var currentAudio = null;
  var sending = false;

  (function(){
    if(!token){ location.replace('/login.html'); return; }
    fetch('/api/check-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})})
      .then(function(r){return r.json()}).then(function(d){ if(!d.valid) location.replace('/login.html'); else init(); })
      .catch(function(){ init(); });
  })();

  function el(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function scroll(){ var m=el('msgs'); m.scrollTop=m.scrollHeight; }

  function init(){
    el('h-av').src = AGENT.avatar; el('h-name').textContent = AGENT.name;
    document.title = AGENT.name + ' — NyXia';
    if(AGENT.video && AGENT.video.indexOf('http')===0){
      var m=document.createElement('div'); m.className='msg';
      m.innerHTML='<img class="av" src="'+esc(AGENT.avatar)+'">';
      var col=document.createElement('div'); col.className='col';
      var v=document.createElement('video'); v.className='welcome'; v.src=AGENT.video; v.controls=true; v.autoplay=true; v.playsInline=true;
      col.appendChild(v); m.appendChild(col); el('msgs').appendChild(m);
      v.play().catch(function(){
        var go=function(){ v.play().catch(function(){}); document.removeEventListener('click',go); document.removeEventListener('keydown',go); document.removeEventListener('touchstart',go); };
        document.addEventListener('click',go); document.addEventListener('keydown',go); document.addEventListener('touchstart',go);
      });
    }
    if(AGENT.greeting) addBot(AGENT.greeting, false);
    el('send').addEventListener('click', function(){ send(); });
    el('input').addEventListener('keydown', function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
    el('input').addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
    setupMic();
    foRefreshLaunchButton();
    // Pont depuis la page Miroir : si un exercice a été déposé, Séléna le reçoit et le lance automatiquement.
    try {
      var pend = sessionStorage.getItem('pending_selena');
      if (pend) {
        sessionStorage.removeItem('pending_selena');
        var inp = el('input');
        if (inp) { inp.value = pend; setTimeout(function(){ send(); }, 500); }
      }
    } catch(e){}
  }

  function addUser(text){
    var m=document.createElement('div'); m.className='msg user';
    m.innerHTML='<div class="av u">'+esc(userName.charAt(0).toUpperCase())+'</div>';
    var col=document.createElement('div'); col.className='col';
    var b=document.createElement('div'); b.className='bubble'; b.textContent=text;
    col.appendChild(b); m.appendChild(col); el('msgs').appendChild(m); scroll();
  }

  function render(text){
    return esc(text)
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
      .replace(/\n/g,'<br>');
  }

  function mkBtn(label, fn){ var b=document.createElement('button'); b.textContent=label; b.onclick=fn; return b; }


  var _foHasProgress = false
  function foRefreshLaunchButton() {
    var tok = (typeof sessionToken !== 'undefined' && sessionToken) ? sessionToken : ((typeof token !== 'undefined' && token) ? token : '')
    var ag = (typeof _currentAgent !== 'undefined' && _currentAgent) ? _currentAgent : ((typeof AGENT !== 'undefined' && AGENT && AGENT.code) ? AGENT.code : '')
    if (!tok) return
    fetch('/api/formation/list', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: tok, agent: ag })
    })
    .then(function(r){ return r.json() })
    .then(function(data) {
      var formations = (data && data.formations) || []
      var wrap = document.getElementById('formation-launch-wrap')
      var btn = document.getElementById('formation-launch')
      if (!wrap || !btn) return
      if (!formations.length) { wrap.style.display = 'none'; return }
      _foHasProgress = formations.some(function(f) { return f.progress && (f.progress.moduleId || f.progress.moduleNumero != null) })
      btn.textContent = _foHasProgress ? '▸ Continuer ma formation' : '✨ Commencer ma formation'
      wrap.style.display = 'block'
    })
    .catch(function(){})
  }
  function foLaunch() {
    var msg = _foHasProgress ? 'continue ma formation' : 'commence ma formation'
    if (typeof sendMessageText === 'function') sendMessageText(msg, false)
    else if (typeof send === 'function') {
      var inp = document.getElementById('input') || document.getElementById('chat-input')
      if (inp) inp.value = msg
      send()
    }
    setTimeout(foRefreshLaunchButton, 1200)
  }

  function addBot(raw, autoSpeak){
    var m=document.createElement('div'); m.className='msg';
    m.innerHTML='<img class="av" src="'+esc(AGENT.avatar)+'">';
    var col=document.createElement('div'); col.className='col';
    var b=document.createElement('div'); b.className='bubble';

    var display=raw;
    var parch=display.match(/\[PARCHEMIN\]([\s\S]*?)\[\/PARCHEMIN\]/i); var parchText=null;
    if(parch){ parchText=parch[1].trim(); display=display.replace(parch[0],'').trim(); }
    var img=display.match(/\[IMAGE\s*:\s*([\s\S]*?)\]/i) || display.match(/\[PARCHEMIN_IMAGE\s*:\s*([\s\S]*?)\]/i); var imgPrompt=null;
    if(img){ imgPrompt=img[1].trim(); display=display.replace(img[0],'').trim(); }
    var photoUrls=[], audioUrls=[], videoUrls=[], mm;
    var rxP=/\[PHOTO\s*:\s*([^\]\r\n]+)\]/gi; while((mm=rxP.exec(display))!==null){ var u=mm[1].trim(); if(u.indexOf('http')===0) photoUrls.push(u); }
    display=display.replace(/\[PHOTO\s*:\s*[^\]\r\n]+\]/gi,'').trim();
    var rxA=/\[AUDIO\s*:\s*([^\]\r\n]+)\]/gi; while((mm=rxA.exec(display))!==null){ var u=mm[1].trim(); if(u.indexOf('http')===0) audioUrls.push(u); }
    display=display.replace(/\[AUDIO\s*:\s*[^\]\r\n]+\]/gi,'').trim();
    var rxV=/\[VIDEO\s*:\s*([^\]\r\n]+)\]/gi; while((mm=rxV.exec(display))!==null){ var u=mm[1].trim(); if(u.indexOf('http')===0) videoUrls.push(u); }
    display=display.replace(/\[VIDEO\s*:\s*[^\]\r\n]+\]/gi,'').trim();
    display=display.replace(/\[LIEN\s*:\s*([^\]\r\n]+)\]/gi, function(_, raw){
      raw=String(raw||'').trim(); var href=raw, lab=raw; var sp=raw.split(/\s+/); if(sp[0]&&sp[0].indexOf('http')===0){href=sp[0];lab=sp.slice(1).join(' ')||href;}
      return '['+lab+']('+href+')';
    });

    b.innerHTML=render(display||'…'); col.appendChild(b);
    photoUrls.forEach(function(u){ var im=document.createElement('img'); im.className='gen-img'; im.src=u; im.alt='photo'; col.appendChild(im); });
    audioUrls.forEach(function(u){ var au=document.createElement('audio'); au.controls=true; au.src=u; au.style.cssText='width:min(100%,420px);margin-top:6px'; col.appendChild(au); });
    videoUrls.forEach(function(u){
      if(/youtu\.be|youtube\.com/i.test(u)){
        var id=''; try{var url=new URL(u); id=url.searchParams.get('v')||url.pathname.split('/').pop();}catch(e){}
        if(id){ var ifr=document.createElement('iframe'); ifr.src='https://www.youtube-nocookie.com/embed/'+id; ifr.allowFullscreen=true; ifr.style.cssText='width:min(100%,420px);aspect-ratio:16/9;border:0;border-radius:12px;margin-top:6px'; col.appendChild(ifr); return; }
      }
      var v=document.createElement('video'); v.controls=true; v.playsInline=true; v.src=u; v.style.cssText='width:min(100%,420px);border-radius:12px;margin-top:6px';
      col.appendChild(v);
    });

    if(parchText){
      var pc=document.createElement('div'); pc.className='parch'; pc.textContent=parchText;
      var cp2=document.createElement('button'); cp2.className='parch-copy'; cp2.textContent='📋 Copier le parchemin';
      cp2.onclick=function(){ navigator.clipboard.writeText(parchText); cp2.textContent='✓ Copié !'; setTimeout(function(){cp2.textContent='📋 Copier le parchemin';},1800); };
      pc.appendChild(document.createElement('br')); pc.appendChild(cp2); col.appendChild(pc);
    }
    if(imgPrompt){
      var seed=Math.floor(Math.random()*99999);
      var im=document.createElement('img'); im.className='gen-img'; im.alt='illustration';
      im.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(imgPrompt+', high quality, detailed')+'?width=768&height=768&model=flux&seed='+seed+'&private=true';
      im.onerror=function(){ im.onerror=null; im.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(imgPrompt.substring(0,100))+'?width=768&height=768&seed='+seed+'&private=true'; };
      col.appendChild(im);
    }

    var textForTools = display || raw;
    var actions=document.createElement('div'); actions.className='actions';
    var sp=mkBtn('🔊 Écouter', function(){ speakMsg(sp, textForTools); });
    var cp=mkBtn('📋 Copier', function(){ navigator.clipboard.writeText(textForTools); cp.textContent='✓ Copié'; setTimeout(function(){cp.textContent='📋 Copier';},1500); });
    var rt=mkBtn('↺ Réessayer', function(){ retry(m); });
    var pd=mkBtn('⬇ PDF', function(){ toPdf(textForTools); });
    actions.appendChild(sp); actions.appendChild(cp); actions.appendChild(rt); actions.appendChild(pd);
    col.appendChild(actions);

    m.appendChild(col); el('msgs').appendChild(m); scroll();
    if(autoSpeak) speakMsg(sp, textForTools); // Éric répond à voix haute automatiquement
  }

  function addTyping(){
    var m=document.createElement('div'); m.className='msg'; m.id='typing';
    m.innerHTML='<img class="av" src="'+esc(AGENT.avatar)+'"><div class="bubble"><span class="nx-dots"><i></i><i></i><i></i></span></div>';
    el('msgs').appendChild(m); scroll();
  }
  function rmTyping(){ var t=el('typing'); if(t) t.remove(); }

  function send(){
    if(sending) return;
    var text=el('input').value.trim(); if(!text) return;
    el('input').value=''; el('input').style.height='auto';
    addUser(text); history.push({role:'user',content:text}); lastUserMessage=text;
    callApi();
  }

  function retry(msgEl){
    if(!lastUserMessage) return;
    if(msgEl && msgEl.parentNode) msgEl.remove();
    if(history.length && history[history.length-1].role==='assistant') history.pop();
    callApi();
  }

  function callApi(){
    sending=true; el('send').disabled=true; addTyping();
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:lastUserMessage, history:history.slice(-10), userName:userName, agent:AGENT.code, attachment:null, token:token})})
      .then(function(r){ return r.text().then(function(txt){ var d; try{ d=JSON.parse(txt); }catch(e){ d={content:'Réponse inattendue ('+r.status+') : '+(txt||'').slice(0,300)}; } return d; }); })
      .then(function(d){
        rmTyping();
        var reply=d.content||d.error||'Petite interruption... réessaie dans un instant 💜';
        addBot(reply, true); history.push({role:'assistant',content:reply});
        if(history.length>20) history=history.slice(-20);
        sending=false; el('send').disabled=false;
      }).catch(function(err){ rmTyping(); addBot('Erreur réseau : '+((err&&err.message)||err)); sending=false; el('send').disabled=false; });
  }

  // ── Voix (Éric répond à voix haute) ──
  var sessionToken = token;
  var _currentAgent = AGENT.code;

  function cleanForSpeech(str){
    return (str||'')
      .replace(/\*\*(.*?)\*\*/g,'$1').replace(/\*(.*?)\*/g,'$1')
      .replace(/---+/g,'').replace(/#{1,6}\s+/g,'').replace(/^>+\s*/gm,'')
      .replace(/\[IMAGE[\s\S]*?\]/gi,'').replace(/\[PARCHEMIN\][\s\S]*?\[\/PARCHEMIN\]/gi,'').replace(/\[PHOTO\s*:[^\]]+\]/gi,'').replace(/\[AUDIO\s*:[^\]]+\]/gi,'').replace(/\[VIDEO\s*:[^\]]+\]/gi,'').replace(/\[LIEN\s*:[^\]]+\]/gi,'')
      .replace(/[✦💜🚀💎🌐📱⭐✓►▶🪞🌿🕯️🌙✨📖🔥👑😉📚📜]/gu,'').trim();
  }

  function stopSpeakBtn(btn){
    btn._nxSpeaking=false; btn.textContent='🔊 Écouter';
    if(btn._nxAudio){ try{btn._nxAudio.pause();}catch(e){} btn._nxAudio=null; }
  }

  function speakMsg(btn, text){
    if(btn._nxSpeaking){ stopSpeakBtn(btn); return; }
    document.querySelectorAll('.actions button').forEach(function(b){ if(b._nxSpeaking) stopSpeakBtn(b); });
    speakViaHeyGen(btn, text, _currentAgent);
  }

  function speakViaHeyGen(btn, text, agentKey){
    var clean=cleanForSpeech(text); if(!clean) return;
    btn._nxSpeaking=true; btn.textContent='⏳ Un instant...';
    fetch('/api/tts/nyxia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:sessionToken,text:clean,agent:agentKey})})
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(!data.success || !data.proxyUrl) throw new Error(data.error||'Pas de voix pour cet agent');
        var audio=new Audio(data.proxyUrl); btn._nxAudio=audio; btn.textContent='⏹ Arrêter'; audio.play();
        audio.onended=audio.onerror=function(){ stopSpeakBtn(btn); };
      })
      .catch(function(err){ btn.title=err.message; btn.textContent='⚠️ Voix indisponible'; setTimeout(function(){ stopSpeakBtn(btn); },2500); });
  }

  // ── PDF de la réponse ──
  function toPdf(text){
    try{
      var jsPDF=window.jspdf.jsPDF; var doc=new jsPDF();
      doc.setFont('helvetica'); doc.setFontSize(12);
      var lines=doc.splitTextToSize(text, 180);
      doc.text(lines, 15, 20);
      doc.save(AGENT.name+'-note.pdf');
    }catch(e){ alert('PDF indisponible : '+(e.message||e)); }
  }

  // ── Micro : écoute CONTINUE, 4 s de silence avant d'arrêter ──
  function setupMic(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    var mic=el('mic'), hint=el('mic-hint');
    if(!SR){ mic.style.display='none'; return; }
    var rec=new SR(); rec.lang='fr-FR'; rec.continuous=true; rec.interimResults=true;
    var on=false, finalText='', silence=null;
    function resetSilence(){ if(silence) clearTimeout(silence); silence=setTimeout(function(){ if(on) rec.stop(); }, 4000); }
    mic.onclick=function(){ if(on){ rec.stop(); return; } finalText=''; el('input').value=''; try{ rec.start(); }catch(e){} };
    rec.onstart=function(){ on=true; mic.classList.add('on'); hint.textContent='🎙️ Je t\'écoute… prends ton temps, je ne te couperai pas.'; resetSilence(); };
    rec.onresult=function(e){
      var interim='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) finalText += e.results[i][0].transcript+' ';
        else interim += e.results[i][0].transcript;
      }
      el('input').value=(finalText+interim).trim();
      el('input').style.height='auto'; el('input').style.height=Math.min(el('input').scrollHeight,120)+'px';
      resetSilence();
    };
    rec.onend=function(){ on=false; mic.classList.remove('on'); hint.textContent=''; if(silence) clearTimeout(silence); if(el('input').value.trim()) send(); };
    rec.onerror=function(){ on=false; mic.classList.remove('on'); hint.textContent=''; if(silence) clearTimeout(silence); };
  }
  </script>
